name: Backend CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean verify

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        if: github.event_name == 'push'
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          # Convert branch name and image repository name to lowercase for Docker tag compliance
          BRANCH_TAG=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/outflow-backend" | tr '[:upper:]' '[:lower:]')
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "branch_tag=$BRANCH_TAG" >> $GITHUB_OUTPUT
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Build and push image (feature branch)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.branch_tag }}
            ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.branch_tag }}-${{ steps.vars.outputs.sha_short }}

      - name: Build and push image (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image_name }}:latest
            ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.sha_short }}

      - name: Trigger Render redeploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}